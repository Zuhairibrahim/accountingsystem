<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 675px; font-family: "Segoe UI", Tahoma, Arial, sans-serif; overflow: hidden; }
  .cover {
    width: 1200px; height: 675px; position: relative;
    background: linear-gradient(135deg, #0B1220 0%, #15264B 60%, #0B1220 100%);
    display: flex; flex-direction: row; align-items: center; padding: 40px 50px;
  }
  .gold { color: #F5B21A; }
  .text-side { width: 46%; padding-left: 30px; z-index: 2; }
  .shot-side { width: 54%; position: relative; height: 100%; display: flex; align-items: center; justify-content: center; }
  .shot-side img {
    width: 105%; max-width: 105%; border-radius: 12px;
    border: 3px solid rgba(245,178,26,.55);
    box-shadow: 0 24px 70px rgba(0,0,0,.65);
  }
  h1 { color: #fff; font-size: 44px; font-weight: 800; line-height: 1.35; margin-bottom: 14px; }
  h2 { color: #c9d4ea; font-size: 24px; font-weight: 600; line-height: 1.6; margin-bottom: 22px; }
  .feats { list-style: none; margin-bottom: 26px; }
  .feats li { color: #e8edf7; font-size: 21px; line-height: 2.0; }
  .feats li::before { content: "✔"; color: #F5B21A; margin-left: 10px; font-weight: bold; }
  .badges { display: flex; gap: 12px; flex-wrap: wrap; }
  .badge {
    background: linear-gradient(135deg, #F5B21A, #d9990d); color: #0B1220;
    font-weight: 800; font-size: 18px; padding: 9px 20px; border-radius: 30px;
  }
  .badge.dark { background: rgba(255,255,255,.08); color: #F5B21A; border: 1.5px solid rgba(245,178,26,.6); }
</style>
</head>
<body>
  <div class="cover">
    <div class="text-side">
      <h1>نظام محاسبي متكامل<br><span class="gold">لمتجرك أو شركتك</span></h1>
      <h2>فواتير • مخازن • عملاء • تقارير • فروع</h2>
      <ul class="feats">
        <li>نقطة بيع سريعة + طباعة الفواتير</li>
        <li>سحابي — يعمل من أي جهاز بالعالم</li>
        <li>تطبيق EXE للابتوب + APK للجوال</li>
        <li>إنشاء فروع بلا حدود (حتى 100 فرع)</li>
        <li>تقارير مبيعات ومخزون لحظية</li>
      </ul>
      <div class="badges">
        <span class="badge">جاهز للتشغيل فوراً</span>
        <span class="badge dark">دعم فني + تركيب</span>
      </div>
    </div>
    <div class="shot-side">
      <img src="01_dashboard.png" alt="">
    </div>
  </div>
</body>
</html>
