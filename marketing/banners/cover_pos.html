<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 675px; font-family: "Segoe UI", Tahoma, Arial, sans-serif; overflow: hidden; }
  .cover {
    width: 1200px; height: 675px; position: relative;
    background: linear-gradient(135deg, #0B1220 0%, #15264B 60%, #0B1220 100%);
    display: flex; flex-direction: row; align-items: center; padding: 40px 50px;
  }
  .text-side { width: 46%; padding-left: 30px; z-index: 2; }
  .shot-side { width: 54%; position: relative; height: 100%; display: flex; align-items: center; justify-content: center; }
  .shot-side img {
    width: 105%; max-width: 105%; border-radius: 12px;
    border: 3px solid rgba(245,178,26,.55);
    box-shadow: 0 24px 70px rgba(0,0,0,.65);
  }
  .gold { color: #F5B21A; }
  h1 { color: #fff; font-size: 42px; font-weight: 800; line-height: 1.4; margin-bottom: 16px; }
  h2 { color: #c9d4ea; font-size: 23px; font-weight: 600; line-height: 1.7; margin-bottom: 24px; }
  .feats { list-style: none; margin-bottom: 26px; }
  .feats li { color: #e8edf7; font-size: 21px; line-height: 2.05; }
  .feats li::before { content: "✔"; color: #F5B21A; margin-left: 10px; font-weight: bold; }
  .badge {
    display: inline-block;
    background: linear-gradient(135deg, #F5B21A, #d9990d); color: #0B1220;
    font-weight: 800; font-size: 19px; padding: 10px 24px; border-radius: 30px;
  }
</style>
</head>
<body>
  <div class="cover">
    <div class="text-side">
      <h1>نقطة بيع سريعة<br><span class="gold">فاتورة في ثوانٍ</span></h1>
      <h2>كل أقسام محلك… منظمة في مكان واحد</h2>
      <ul class="feats">
        <li>مبيعات • مشتريات • عملاء • موردين</li>
        <li>مخزون • صندوق • بنوك • مصروفات</li>
        <li>موظفين • رواتب • حضور وانصراف</li>
        <li>تقارير لحظية + ترحيل نهاية اليوم</li>
      </ul>
      <span class="badge">واجهة عربية RTL سهلة لأي موظف</span>
    </div>
    <div class="shot-side">
      <img src="15_sc_620.png" alt="">
    </div>
  </div>
</body>
</html>
