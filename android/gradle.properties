org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m
kotlin.daemon.jvmargs=-Xmx2G
# ترجمة Kotlin داخل عملية Gradle نفسها — يمنع فشل الاتصال بالـ daemon
# على أجهزة Windows المختلفة (يعمل على أي جهاز بالعالم بدون إعداد).
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
