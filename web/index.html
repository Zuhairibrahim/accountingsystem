<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="نظام محاسبي متكامل — سحابي 100% عبر Firebase">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="النظام المحاسبي">
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=2026v2">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png?v=2026v2"/>

  <title>النظام المحاسبي المتكامل</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // تنظيف النسخة القديمة: إلغاء Service Worker القديم وحذف الكاش
    (async () => {
      try {
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map(k => caches.delete(k)));
        }
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(r => r.unregister()));
        }
      } catch (e) {}
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
